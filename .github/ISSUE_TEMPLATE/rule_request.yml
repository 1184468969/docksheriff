name: Rule request
description: Propose a narrowly scoped, read-only container configuration rule.
title: "[Rule]: "
labels:
  - enhancement
  - rule
body:
  - type: markdown
    attributes:
      value: |
        A rule must be implementable from the existing read-only Engine boundary: ping, server version, container list, and container inspect. DockSheriff does not add exec/cp, mutation, environment or arbitrary-label evaluation/output, image CVE scanning, telemetry, or non-Engine network access.

        Use synthetic or fully redacted examples. Do not paste credentials, environment variables, arbitrary labels, or complete Inspect JSON.
  - type: input
    id: title
    attributes:
      label: Proposed rule name
      placeholder: Short configuration risk name
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security risk
      description: Explain the concrete risk without claiming it is exploitable in every workload.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Structured Inspect fields
      description: List the minimum non-sensitive fields needed. Requests requiring Env, arbitrary Labels, full Inspect output, exec, filesystem reads, or another network service are out of scope.
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: Positive, negative, and boundary examples
      description: Use synthetic values and describe duplicate-suppression behavior.
      render: text
    validations:
      required: true
  - type: textarea
    id: remediation
    attributes:
      label: Actionable remediation
      description: Suggest a safer configuration without asking DockSheriff to mutate it.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: False-positive and false-negative tradeoffs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Scope confirmation
      options:
        - label: This can be evaluated without Docker writes, exec/cp, environment variables, arbitrary labels, privileged tests, telemetry, or non-Engine network access.
          required: true
        - label: All examples are synthetic or redacted and contain no complete Inspect response.
          required: true
